[package]
name = "mancala-engine"
version = "0.1.0"
edition = "2021"
description = "Rust port of the dansing2 FairKalah bot (alpha-beta + regression heuristic), compiled to WASM for the browser."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
